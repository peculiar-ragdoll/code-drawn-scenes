<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Bowl</title>
<style>
  :root { --bg: #10172a; }
  html, body { margin: 0; background: var(--bg); }
  body { min-height: 100vh; display: flex; align-items: center; }
  canvas { display: block; width: 100vw; height: auto; aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="A screen-print style poster: a ramen stall glowing on a rainy city corner at night, a cook at work inside and a customer with an umbrella at the counter. Title: Late Night, Noodles."></canvas>
<script>
(() => {
'use strict';
// ======================================================================================
// LAST BOWL — a 1930s screen-print travel poster drawn in Canvas2D.
// Six inks only, no gradients: tone comes from flat shapes, hatching and stipple.
// World units are metres; one shared one-point projection (eye 1.6 m, VP on the horizon).
// ======================================================================================
const W = 1600, H = 900, TAU = Math.PI * 2, PI = Math.PI;
const Q = new URLSearchParams(location.search);
const DPRMAX = +(Q.get('dprMax') || 2), TFIX = Q.has('t') ? +Q.get('t') : null;

// ---- the six inks ----
const navy = '#17213b', slate = '#4f6489', teal = '#2e8487', verm = '#de4a2c', cream = '#f2e8cc', must = '#e3a933';

// ---- camera: one-point perspective ----
const F = 700, HZ = 440, VX = 640, EYE = 1.6;
let MIR = false;                       // true = draw the scene mirrored in the ground plane (puddle)
const P = (x, h, z) => [VX + F * x / z, HZ + F * (EYE - (MIR ? -h : h)) / z];
const S = z => F / z;                  // px per metre at depth z
const IMG = { x0: 20, y0: 20, x1: 1580, y1: 770 };

// ---- deterministic randomness ----
const mul = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---- path helpers ----
function pth(c, pts, close = true) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); if (close) c.closePath(); }
function fillP(c, pts, ink) { pth(c, pts); c.fillStyle = ink; c.fill(); }
function strokeP(c, pts, ink, lw, close = false) { pth(c, pts, close); c.strokeStyle = ink; c.lineWidth = lw; c.stroke(); }
const W3 = pts => pts.map(p => P(p[0], p[1], p[2]));
function fill3(c, pts, ink) { fillP(c, W3(pts), ink); }
function line3(c, a, b, ink, lw) { const A = P(a[0], a[1], a[2]), B = P(b[0], b[1], b[2]); c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(B[0], B[1]); c.strokeStyle = ink; c.lineWidth = lw; c.stroke(); }
function poly3(c, pts, ink, lw) { strokeP(c, W3(pts), ink, lw); }
function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); if (p.length < 3) return p;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
// horizontal circle of radius r at height h, projected (angle a: 0=+x, PI/2 = far side)
function ring(x, h, z, r, n = 28, a0 = 0, a1 = TAU) { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push(P(x + r * Math.cos(a), h, z + r * Math.sin(a))); } return o; }
// vertical cylinder: silhouette = hull of both rims; visible cap drawn when given
function cyl(c, x, z, r, h0, h1, body, cap, n = 28) {
  const A = ring(x, h0, z, r, n), B = ring(x, h1, z, r, n);
  fillP(c, hull(A.concat(B)), body);
  if (cap) { if (h1 < EYE) fillP(c, B, cap); else if (h0 > EYE) fillP(c, A, cap); }
  return { A, B };
}
// hatch lines inside the current path (call after building the clip path)
function hatchRect(c, ink, gap, ang, lw, bb) {
  const [x0, y0, x1, y1] = bb, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 2;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  c.strokeStyle = ink; c.lineWidth = lw; c.beginPath();
  for (let d = -R; d <= R; d += gap) { const px = cx - sa * d, py = cy + ca * d; c.moveTo(px - ca * R, py - sa * R); c.lineTo(px + ca * R, py + sa * R); }
  c.stroke();
}
function hatchIn(c, pts, ink, gap, ang, lw) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  c.save(); pth(c, pts); c.clip(); hatchRect(c, ink, gap, ang, lw, [x0, y0, x1, y1]); c.restore();
}
// stipple: gen(r) returns [x, y, radius] or null
function stipple(c, ink, n, seed, gen) { const r = mul(seed); c.fillStyle = ink; c.beginPath(); for (let i = 0; i < n; i++) { const d = gen(r); if (!d) continue; c.moveTo(d[0] + d[2], d[1]); c.arc(d[0], d[1], d[2], 0, TAU); } c.fill(); }
// dots thinning out across a vertical band (dense at yDense)
function stippleBand(c, ink, x0, x1, yA, yDense, n, seed, rad = 1.1) {
  stipple(c, ink, n, seed, r => { const u = r(), y = lerp(yA, yDense, u); if (r() > Math.pow(u, 1.6)) return null; return [lerp(x0, x1, r()), y, rad * (0.7 + 0.5 * r())]; });
}
// halo of dots around a point (screen space), dense at r0, gone at r1 — a printed "glow" with no blur
function halo(c, ink, x, y, r0, r1, n, seed, rad = 1.2, sx = 1, sy = 1) {
  stipple(c, ink, n, seed, r => { const a = r() * TAU, u = r(), d = lerp(r0, r1, u); if (r() > Math.pow(1 - u, 1.8)) return null; return [x + Math.cos(a) * d * sx, y + Math.sin(a) * d * sy, rad * (0.6 + 0.6 * r())]; });
}

// halftone screen: dots on a rotated grid, dot area follows f(x,y)∈[0,1] — printed tone, no gradients
function halftone(c, ink, bb, cell, dmax, f, ang = .5) {
  const [x0, y0, x1, y1] = bb, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + cell;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  c.fillStyle = ink; c.beginPath();
  for (let i = -R; i <= R; i += cell) for (let j = -R; j <= R; j += cell) {
    const x = cx + i * ca - j * sa, y = cy + i * sa + j * ca;
    if (x < x0 || x > x1 || y < y0 || y > y1) continue;
    const v = f(x, y); if (v <= .02) continue;
    const r = dmax * Math.sqrt(Math.min(1, v)); if (r < .3) continue;
    c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU);
  }
  c.fill();
}
// radial halftone glow around a point: full at r0, gone by r1 (elliptical with sx, sy)
function glowHT(c, ink, x, y, r0, r1, cell, dmax, sx = 1, sy = 1, pow = 1.3) {
  halftone(c, ink, [x - r1 * sx, y - r1 * sy, x + r1 * sx, y + r1 * sy], cell, dmax, (px, py) => { const d = Math.hypot((px - x) / sx, (py - y) / sy); if (d < r0 || d > r1) return 0; return Math.pow(1 - (d - r0) / (r1 - r0), pow); });
}

// ======================================================================================
// LETTERING — a geometric poster face built from monoline strokes (unit cap height).
// Glyphs are polylines so the same face can be laid onto any plane in the scene.
// ======================================================================================
const G = {};
const def = (ch, w, f, dot) => { G[ch] = { w, f, dot }; };
const ARC = (cx, cy, rx, ry, a0, a1, n = 28) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; };
const EXT = (p, q, d) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return [q[0] + dx / l * d, q[1] + dy / l * d]; };
def('A', .80, (W, h) => { const a = .055, L = [h * 1.25, 1], T1 = [W / 2 - a, h], T2 = [W / 2 + a, h], R = [W - h * 1.25, 1], yb = .66, f = (1 - yb) / (1 - h);
  return [[EXT(T1, L, .25), T1, T2, EXT(T2, R, .25)], [[L[0] + (T1[0] - L[0]) * f, yb], [R[0] + (T2[0] - R[0]) * f, yb]]]; });
def('B', .64, (W, h) => { const m = .47, r1 = (m - h) / 2, r2 = (1 - h - m) / 2, c1 = W - .06 - h - r1, c2 = W - h - r2;
  return [[[h, 0], [h, 1]], [[h, h], [c1, h], ...ARC(c1, h + r1, r1, r1, -PI / 2, PI / 2, 14), [h, m]], [[h, m], [c2, m], ...ARC(c2, m + r2, r2, r2, -PI / 2, PI / 2, 16), [h, 1 - h]]]; });
def('C', .80, (W, h) => [ARC(W / 2, .5, W / 2 - h, .5 - h, .27 * PI, 1.73 * PI, 40)]);
def('D', .74, (W, h) => { const r = .5 - h, cx = W - h - r; return [[[h, 0], [h, 1]], [[h, h], [cx, h], ...ARC(cx, .5, r, r, -PI / 2, PI / 2, 24), [h, 1 - h]]]; });
def('E', .58, (W, h) => [[[W, h], [h, h], [h, 1 - h], [W, 1 - h]], [[h, .5], [W - .07, .5]]]);
def('F', .56, (W, h) => [[[W, h], [h, h], [h, 1]], [[h, .52], [W - .1, .52]]]);
def('G', .82, (W, h) => { const cx = W / 2; return [[...ARC(cx, .5, W / 2 - h, .5 - h, -.24 * PI, -2 * PI, 44), [cx + .04, .5]]]; });
def('H', .72, (W, h) => [[[h, 0], [h, 1]], [[W - h, 0], [W - h, 1]], [[h, .5], [W - h, .5]]]);
def('I', 0, (W, h) => [[[h, 0], [h, 1]]]);
def('K', .68, (W, h) => [[[h, 0], [h, 1]], [[W + .04, -.04], [h + .03, .6]], [[h + .2, .44], [W + .06, 1.06]]]);
def('L', .54, (W, h) => [[[h, 0], [h, 1 - h], [W, 1 - h]]]);
def('M', .92, (W, h) => [[[h, 1], [h, h], [W / 2, .8], [W - h, h], [W - h, 1]]]);
def('N', .76, (W, h) => [[[h, 1], [h, h], [W - h, 1 - h], [W - h, 0]]]);
def('O', .90, (W, h) => [ARC(W / 2, .5, W / 2 - h, .5 - h, 0, TAU, 48)]);
def('P', .62, (W, h) => { const r = (.56 - h) / 2, cx = W - h - r; return [[[h, 1], [h, h], [cx, h], ...ARC(cx, h + r, r, r, -PI / 2, PI / 2, 18), [h, h + 2 * r]]]; });
def('R', .66, (W, h) => { const r = (.56 - h) / 2, cx = W - h - r - .03; return [[[h, 1], [h, h], [cx, h], ...ARC(cx, h + r, r, r, -PI / 2, PI / 2, 18), [h, h + 2 * r]], [[cx - .04, h + 2 * r], [W + .02, 1.06]]]; });
def('S', .64, (W, h) => { const R = (1 - 2 * h) / 4, r1 = R * .94, r2 = 2 * R - r1, rx = W / 2 - h, cx = W / 2;
  return [[...ARC(cx, h + r1, rx * .95, r1, -.13 * PI, -1.5 * PI, 26), ...ARC(cx, 1 - h - r2, rx, r2, -.5 * PI, .87 * PI, 28)]]; });
def('T', .66, (W, h) => [[[0, h], [W, h]], [[W / 2, h], [W / 2, 1]]]);
def('U', .72, (W, h) => { const r = W / 2 - h; return [[[h, 0], ...ARC(W / 2, 1 - h - r, r, r, PI, 0, 24), [W - h, 0]]]; });
def('V', .76, (W, h) => [[[-.02, -.08], [W / 2 - .04, 1 - h], [W / 2 + .04, 1 - h], [W + .02, -.08]]]);
def('W', 1.06, (W, h) => [[[-.02, -.08], [W * .25 - .03, 1 - h], [W * .25 + .03, 1 - h], [W / 2 - .025, .28], [W / 2 + .025, .28], [W * .75 - .03, 1 - h], [W * .75 + .03, 1 - h], [W + .02, -.08]]]);
def('Y', .72, (W, h) => [[[-.02, -.06], [W / 2, .5]], [[W + .02, -.06], [W / 2, .5]], [[W / 2, .46], [W / 2, 1]]]);
def('Z', .64, (W, h) => [[[.02, h], [W - h * 1.1, h], [h * 1.1, 1 - h], [W - .02, 1 - h]]]);
def('0', .64, (W, h) => [ARC(W / 2, .5, W / 2 - h, .5 - h, 0, TAU, 40)]);
def('1', .44, (W, h) => [[[.02, .24], [W - h, h * .3], [W - h, 1]]]);
def('2', .62, (W, h) => { const r = W / 2 - h; return [[...ARC(W / 2, h + r * .95, r, r * .95, PI * 1.02, PI * 2.15, 24), [h * 1.1, 1 - h], [W, 1 - h]]]; });
def('3', .60, (W, h) => { const R = (1 - 2 * h) / 4, r1 = R * .92, r2 = 2 * R - r1, rx = W / 2 - h; return [ARC(W / 2, h + r1, rx * .92, r1, 1.12 * PI, 2.5 * PI, 24), ARC(W / 2, 1 - h - r2, rx, r2, 1.5 * PI, 2.88 * PI, 26)]; });
def('4', .66, (W, h) => [[[W - .17, 1], [W - .17, h * .3], [h * .8, .7], [W, .7]]]);
def('5', .60, (W, h) => { const r = .29; return [[[W - .02, h], [h + .02, h], [h, .47], ...ARC(W / 2 - .01, 1 - h - r, W / 2 - h, r, -.78 * PI, .82 * PI, 26)]]; });
def('6', .62, (W, h) => { const r = W / 2 - h, cy = 1 - h - r; return [[[W * .68, -.02], [h + .05, cy - .02]], ARC(W / 2, cy, r, r, 0, TAU, 36)]; });
def('7', .60, (W, h) => [[[0, h], [W - h, h], [W * .32, 1.06]]]);
def('8', .62, (W, h) => { const R = (1 - 2 * h) / 4, r1 = R * .86, r2 = 2 * R - r1; return [ARC(W / 2, h + r1, (W / 2 - h) * .88, r1, 0, TAU, 30), ARC(W / 2, 1 - h - r2, W / 2 - h, r2, 0, TAU, 30)]; });
def('9', .62, (W, h) => { const r = W / 2 - h, cy = h + r; return [[[W * .32, 1.02], [W - h - .05, cy + .02]], ARC(W / 2, cy, r, r, 0, TAU, 36)]; });
def('·', .40, null, .5);
def('.', .26, null, .88);
def('-', .42, (W, h) => [[[.04, .56], [W - .04, .56]]]);
def(' ', .34, null);
const gW = (ch, wt) => { const g = G[ch] || G[' ']; return g.w === 0 ? wt : g.w; };
function textWidth(s, cap, wt, tr) { let w = 0; for (let i = 0; i < s.length; i++) { w += gW(s[i], wt) * cap; if (i < s.length - 1) w += tr * cap; } return w; }
// draw text in a layout space (u right, v down); map() takes layout to screen (default identity)
function drawText(c, s, x, y, cap, o) {
  const wt = o.wt || .15, tr = o.track ?? .1, map = o.map || ((u, v) => [u, v]), lw = o.lw || wt * cap;
  let u = x - (o.align === 'center' ? textWidth(s, cap, wt, tr) / 2 : o.align === 'right' ? textWidth(s, cap, wt, tr) : 0);
  c.strokeStyle = o.ink; c.fillStyle = o.ink; c.lineWidth = lw; c.lineJoin = 'miter'; c.miterLimit = 10; c.lineCap = 'butt';
  for (const ch of s) {
    const g = G[ch] || G[' '], gw = gW(ch, wt);
    if (g.dot) { const p = map(u + gw * cap / 2, y + g.dot * cap); c.beginPath(); c.arc(p[0], p[1], lw * .66, 0, TAU); c.fill(); }
    else if (g.f) {
      const lines = g.f(gw, wt / 2);
      c.save(); pth(c, [map(u, y), map(u + gw * cap, y), map(u + gw * cap, y + cap), map(u, y + cap)]); c.clip(); c.beginPath();
      for (const L of lines) {
        L.forEach((p, i) => { const q = map(u + p[0] * cap, y + p[1] * cap); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
        const a = L[0], b = L[L.length - 1]; if (Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6) c.closePath();
      }
      c.stroke(); c.restore();
    }
    u += gw * cap + tr * cap;
  }
}

// ======================================================================================
// SCENE DATA
// ======================================================================================
// Street: road x∈[-3.5, 2.3]; left sidewalk to the left building (x=-6.5); the stall's corner
// sidewalk on the right (z<7.2), a lane crossing behind it (z 7.2–13.6), block 2 beyond (front z=15.5).
const LB = { X: -7.0, z0: 6.5, z1: 32, H: 16 };            // left building, facade facing the street
const B2 = { X: 6.5, zf: 15.5, z1: 30, H: 13 };             // block 2: front at zf, side facade along the street
const FAR = { z: 48, blocks: [[-15, -6, 19], [-6, -.6, 12.5], [-.6, 5.4, 15.5], [5.4, 16, 22], [16, 30, 14]] };
const LAMP = { x: 2.78, z: 14.0, hx: 2.02, hh: 4.42 };      // post position and lamp-head position
const SIGN = { z: 22, x0: -6.68, x1: -5.75, h0: 3.9, h1: 8.75, th: .22, flick: 3 }; // HOTEL blade sign
const ST = { x0: 2.8, x1: 5.2, zf: 5.5, zb: 6.3, cnt: { x0: 2.72, x1: 5.28, z0: 5.35, z1: 5.78, h: .97 },
  roof: { x0: 2.62, x1: 5.38, zf: 5.0, zb: 7.0, hf: 2.22, hb: 2.9 }, bulb: [4.3, 1.67, 6.0],
  noren: { x0: 2.86, x1: 5.14, z: 5.06, h0: 1.70, h1: 2.0 } };
const LANT = { px: 5.56, ph: 2.17, z: 5.0 };               // lantern pivot (hook)
const PUD = (() => { const o = []; for (let i = 0; i < 72; i++) { const a = i / 72 * TAU, r = 1 + .13 * Math.sin(3 * a + 1.1) + .07 * Math.sin(5 * a + 2.3) + .04 * Math.sin(8 * a); o.push([.02 + Math.cos(a) * 1.02 * r, 3.9 + Math.sin(a) * .36 * r]); } return o; })();
const roofH = z => lerp(ST.roof.hf, ST.roof.hb, (z - ST.roof.zf) / (ST.roof.zb - ST.roof.zf));
const wetCol = i => [teal, teal, cream, teal, must, cream, teal][i % 7];

// ======================================================================================
// STATIC LAYER: sky, city, buildings, ground (baked once per size)
// ======================================================================================
function drawSky(c) {
  c.fillStyle = navy; c.fillRect(0, 0, W, H);
  // city glow on the low rain mist: stepped bands, edges stippled
  c.fillStyle = slate; c.fillRect(0, 262, W, HZ - 262 + 30);
  halftone(c, slate, [0, 214, W, 263], 3.6, 1.7, (x, y) => Math.pow((y - 214) / 49, 1.4), .6);
  c.fillStyle = teal; c.fillRect(0, 334, W, HZ - 334 + 30);
  halftone(c, teal, [0, 296, W, 335], 3.4, 1.6, (x, y) => Math.pow((y - 296) / 39, 1.4), .6);
  // high cloud deck with hanging bellies
  const r = mul(5);
  c.fillStyle = slate; c.beginPath(); c.rect(0, 0, W, 50);
  for (let x = -40; x < W + 60; x += 58 + r() * 40) { const rx = 46 + r() * 40, ry = 16 + r() * 18; c.moveTo(x + rx, 50); c.ellipse(x, 50, rx, ry, 0, 0, TAU); }
  c.fill();
  c.save(); c.beginPath(); c.rect(0, 0, W, 40); c.clip(); hatchRect(c, navy, 4.2, 0, 1.6, [0, 0, W, 40]); c.restore();
  // middle cloud bank: lit from below by the city (teal crescent under each lobe)
  const lobes = []; for (let x = 360; x < 1180; x += 40 + r() * 34) lobes.push([x, 112 + r() * 14, 34 + r() * 30, 11 + r() * 9]);
  c.fillStyle = teal; c.beginPath(); for (const [x, y, rx, ry] of lobes) { c.moveTo(x + rx, y + 5); c.ellipse(x, y + 5, rx, ry, 0, 0, TAU); } c.fill();
  // the bank's body: a lobed top (heaped cumulus) as well as lobed bellies
  c.fillStyle = slate; c.beginPath(); c.rect(340, 98, 860, 22);
  for (let x = 330; x < 1210; x += 46 + r() * 40) { const rx = 40 + r() * 36, ry = 14 + r() * 16, y = 100 + r() * 8; c.moveTo(x + rx, y); c.ellipse(x, y, rx, ry, 0, 0, TAU); }
  for (const [x, y, rx, ry] of lobes) { c.moveTo(x + rx, y); c.ellipse(x, y, rx, ry, 0, 0, TAU); } c.fill();
  // rain veils: tapering strokes of varied length falling from the bellies, thinning toward the ground
  c.strokeStyle = slate; c.lineCap = 'round';
  for (let i = 0; i < 90; i++) { const x = 350 + r() * 840, y0 = 128 + r() * 10, L = 14 + r() * 50; let y = y0;

}

function drawFarBlocks(c) {
  const z = FAR.z;
  FAR.blocks.forEach(([x0, x1, h], bi) => {
    fill3(c, [[x0, 0, z], [x1, 0, z], [x1, h, z], [x0, h, z]], navy);
    fill3(c, [[x0, h - .5, z], [x1, h - .5, z], [x1, h, z], [x0, h, z]], slate);           // parapet catching the glow

}

function drawWaterTower(c) {
  // timber tank on steel legs, on the roof of far block 2
  const x = -3.3, z = 49.2, base = 12.5, legTop = 13.9, top = 17.1, R = 1.5, s = S(z);
  // legs + bracing, standing behind the parapet of the facade (clipped where the parapet hides them)
  const py = P(x, base, FAR.z)[1];
  c.save(); c.beginPath(); MIR ? c.rect(0, py, W, H) : c.rect(0, 0, W, py); c.clip();
  const legs = [[-1.1, -.9], [1.1, -.9], [-1.1, .9], [1.1, .9]];
  for (const [dx, dz] of legs) line3(c, [x + dx, base, z + dz], [x + dx * .9, legTop, z + dz * .9], navy, Math.max(1, .14 * s));
  line3(c, [x - 1.1, base + .2, z - .9], [x + 1.0, legTop - .1, z - .85], navy, 1);
  line3(c, [x + 1.1, base + .2, z - .9], [x - 1.0, legTop - .1, z - .85], navy, 1);
  line3(c, [x + R + .05, base, z - .2], [x + R + .05, legTop, z - .2], slate, .8);
  c.restore();
  // tank body
  const t = cyl(c, x, z, R, legTop, top, navy, null, 32);
  // staves (vertical slate hairlines on the visible front half)
  c.strokeStyle = slate; c.lineWidth = .8; c.beginPath();
  for (let a = PI * 1.08; a < PI * 1.95; a += PI / 11) { const p0 = P(x + R * Math.cos(a), legTop, z + R * Math.sin(a)), p1 = P(x + R * Math.cos(a), top, z + R * Math.sin(a)); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); }
  c.stroke();
  // hoops (front arcs of horizontal circles above the eye)
  for (const hh of [14.3, 15.0, 15.7, 16.4]) strokeP(c, ring(x, hh, z, R * 1.01, 24, PI, TAU), cream, .9);
  // conical roof + finial
  const apex = P(x, top + 1.25, z), rim = ring(x, top, z, R * 1.08, 28);
  fillP(c, hull(rim.concat([apex])), navy);
  strokeP(c, ring(x, top, z, R * 1.08, 24, PI, TAU), slate, 1);
  strokeP(c, [P(x - R * 1.08, top, z), apex, P(x + R * 1.08, top, z)], slate, 1);           // lit edges of the cone
  line3(c, [x, top + 1.2, z], [x, top + 1.7, z], slate, 1.2);
  { const f = P(x, top + 1.75, z); c.fillStyle = cream; c.beginPath(); c.arc(f[0], f[1], 1.1, 0, TAU); c.fill(); }
  // ladder up the side
  line3(c, [x + R + .05, legTop, z - .2], [x + R + .05, top, z - .2], slate, .8);
}

function windowOn(c, wall, a0, a1, h0, h1, plane, glass, seed) {
  // plane(a, h, depth) -> world point; depth = recess into the wall
  const q = (a, h, d) => { const w = plane(a, h, d); return P(w[0], w[1], w[2]); };
  const rev = wall === navy ? slate : navy;                    // on a dark wall the stone reveal reads lighter
  fillP(c, [q(a0, h0, 0), q(a1, h0, 0), q(a1, h1, 0), q(a0, h1, 0)], rev);                     // reveal
  const g = [q(a0, h0, .16), q(a1, h0, .16), q(a1, h1, .16), q(a0, h1, .16)];
  fillP(c, g, glass);
  if (glass !== navy) {
    const v = hash(seed * 1.37);
    if (v < .3) { fillP(c, [q(a0, h1 - (h1 - h0) * .42, .16), q(a1, h1 - (h1 - h0) * .42, .16), q(a1, h1, .16), q(a0, h1, .16)], glass === teal ? slate : must); }   // half-drawn blind
    else if (v < .45 && glass !== cream) {   // a potted plant on the inner sill, in silhouette
      const m = a0 + (a1 - a0) * .3; fillP(c, [q(m - .1, h0, .16), q(m + .1, h0, .16), q(m + .13, h0 + .18, .16), q(m - .13, h0 + .18, .16)], navy);
      const kind = Math.floor(hash(seed * 5.3) * 3);
      if (kind === 0) for (const [dx, hh, lw] of [[-.16, .42, .07], [0, .55, .06], [.15, .4, .07], [-.05, .34, .08]]) { const a = q(m, h0 + .18, .16), b = q(m + dx, h0 + .18 + hh, .16); c.strokeStyle = navy; c.lineWidth = Math.max(1.2, Math.abs(a[0] - q(m + lw, h0, .16)[0]) * .9); c.lineCap = 'round'; c.beginPath(); c.moveTo(a[0], a[1]); c.quadraticCurveTo((a[0] + b[0]) / 2 + (dx > 0 ? 2 : -2), (a[1] + b[1]) / 2, b[0], b[1]); c.stroke(); c.lineCap = 'butt'; }
      else if (kind === 1) {   // a geranium: stems from the soil, clustered leaves, a few red flower heads
        const rr = mul(seed * 17 + 3), soil = q(m, h0 + .18, .16);
        for (let k = 0; k < 5; k++) { const dx = (rr() - .5) * .34, hh = .16 + rr() * .3, tip = q(m + dx, h0 + .18 + hh, .16);
          c.strokeStyle = navy; c.lineWidth = 1; c.beginPath(); c.moveTo(soil[0] + dx * 8, soil[1]); c.quadraticCurveTo(soil[0] + dx * 14, (soil[1] + tip[1]) / 2, tip[0], tip[1]); c.stroke();
          const lr = Math.abs(q(m + .06, h0, .16)[0] - q(m, h0, .16)[0]); c.fillStyle = navy; c.beginPath(); c.ellipse(tip[0], tip[1], lr * 1.1, lr * .7, dx * 3, 0, TAU); c.fill();
          if (k % 2 === 0) { c.fillStyle = verm; c.beginPath(); c.arc(tip[0] + lr * .4, tip[1] - lr * .7, lr * .55, 0, TAU); c.fill(); } }
      }
      else { c.strokeStyle = navy; c.lineWidth = 1.2; for (const dx of [-.12, 0, .12]) { const a = q(m + dx * .5, h0 + .17, .16); c.beginPath(); c.moveTo(a[0], a[1]); for (let k = 1; k <= 5; k++) { const b = q(m + dx + Math.sin(k + dx * 9) * .03, h0 + .17 - k * .06 + .06, .14); c.lineTo(b[0], b[1]); const lf = q(m + dx + .04, h0 + .17 - k * .06 + .06, .14); c.fillStyle = navy; c.beginPath(); c.ellipse(lf[0], lf[1], 1.8, 1.1, .5, 0, TAU); c.fill(); c.beginPath(); c.moveTo(b[0], b[1]); } c.stroke(); } }
    }
  }
  // sash bar + muntin
  const hm = (h0 + h1) / 2, am = (a0 + a1) / 2; c.strokeStyle = glass === navy && wall === navy ? slate : navy; c.lineWidth = 1.4; c.beginPath();
  let p = q(a0, hm, .16); c.moveTo(p[0], p[1]); p = q(a1, hm, .16); c.lineTo(p[0], p[1]);
  p = q(am, h0, .16); c.moveTo(p[0], p[1]); p = q(am, h1, .16); c.lineTo(p[0], p[1]); c.stroke();
  // stone sill catching the street light
  const s0 = q(a0 - .08, h0 - .03, -.06), s1 = q(a1 + .08, h0 - .03, -.06); c.strokeStyle = cream; c.lineWidth = 1.4; c.beginPath(); c.moveTo(s0[0], s0[1]); c.lineTo(s1[0], s1[1]); c.stroke();
}

function drawLeftBuilding(c) {

  c.strokeStyle = navy; c.lineWidth = 1.4; c.beginPath();

function drawFireEscape(c) {
  const X = LB.X, out = LB.X + 1.15, z0 = 11.4, z1 = 16.6, lv = [4.05, 7.25, 10.45, 13.65];
  const lw = z => Math.max(1.3, .05 * S(z));
  lv.forEach((L, i) => {
    // slab seen from below with its grating
    fill3(c, [[X, L, z0], [out, L, z0], [out, L, z1], [X, L, z1]], navy);
    c.strokeStyle = slate; c.lineWidth = 1.4; c.beginPath();
    for (let z = z0 + .4; z < z1; z += .4) { const a = P(X + .05, L, z), b = P(out - .05, L, z); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
    c.stroke();
    fill3(c, [[out, L - .1, z0], [out, L - .1, z1], [out, L, z1], [out, L, z0]], navy);
    // railing
    poly3(c, [[X, L + 1, z0], [out, L + 1, z0], [out, L + 1, z1], [X, L + 1, z1]], navy, lw(z0) * 1.4);
    poly3(c, [[out, L + .5, z0], [out, L + .5, z1]], navy, lw(z0));
    c.strokeStyle = navy; c.lineWidth = lw(z1) * .8; c.beginPath();
    for (let z = z0; z <= z1 + .01; z += .37) { const a = P(out, L, z), b = P(out, L + 1, z); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
    for (const z of [z0, z1]) for (let x = X + .38; x < out; x += .38) { const a = P(x, L, z), b = P(x, L + 1, z); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
    c.stroke();
    poly3(c, [[out, L + 1.02, z0], [out, L + 1.02, z1]], cream, .8);   // wet glint on the top rail
    // stair up to the next platform
    if (i < lv.length - 1) {
      const zs = 16.15, ze = 12.0, xa = X + .3, xb = X + .88, U = lv[i + 1];
      poly3(c, [[xa, L, zs], [xa, U, ze]], navy, lw(14));
      poly3(c, [[xb, L, zs], [xb, U, ze]], navy, lw(14));
      poly3(c, [[xb, L + .9, zs], [xb, U + .9, ze]], navy, lw(14) * .8);
      c.strokeStyle = navy; c.lineWidth = lw(14) * .8; c.beginPath();
      for (let k = 1; k < 15; k++) { const u = k / 15, z = lerp(zs, ze, u), h = lerp(L, U, u), a = P(xa, h, z), b = P(xb, h, z); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
      c.stroke();

// steam: flat cream wisps — a thin curling stem off the surface that swells, then breaks into round puffs drifting downwind
function steam(c, t, x, h, z, n, seed, rise, wmax, clipTop) {
  const sc = S(z); c.fillStyle = cream;
  for (let i = 0; i < n; i++) {
    const sp = .5 + hash(seed + i * 3) * .3, ph = hash(seed + i * 7) * TAU, off = (hash(seed + i) - .5) * .1;
    const cx = u => x + off + Math.sin(u * 4.2 - t * 1.3 * sp + ph) * .035 * (.2 + u) + u * u * .12;   // curl + drift right
    const stemTop = .2 + .05 * Math.sin(t * .7 + ph);
    // the stem: a tapered strip with round ends, thin at the base
    const Lp = [], Rp = [];
    for (let k = 0; k <= 14; k++) { const u = k / 14 * stemTop, p = P(cx(u), h + u * rise, z), q = P(cx(u + .01), h + (u + .01) * rise, z), dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1, w = (.003 + wmax * .4 * u / stemTop) * sc;
      if (clipTop !== undefined && p[1] < clipTop) break; Lp.push([p[0] - dy / l * w, p[1] + dx / l * w]); Rp.push([p[0] + dy / l * w, p[1] - dx / l * w]); }
    if (Lp.length > 2) { fillP(c, Lp.concat(Rp.reverse()), cream); const e = Lp[Lp.length - 1], f = Rp[0]; c.beginPath(); c.arc((e[0] + f[0]) / 2, (e[1] + f[1]) / 2, Math.hypot(e[0] - f[0], e[1] - f[1]) / 2, 0, TAU); c.fill(); }
    // puffs: break away from the stem, rise, swell and shrink away
    for (let k = 0; k < 4; k++) {
      const u = stemTop + .06 + (((t * .22 * sp + k / 4 + hash(seed + i * 11)) % 1)) * (1 - stemTop), v = (u - stemTop) / (1 - stemTop);
      const p = P(cx(u), h + u * rise, z), r = wmax * sc * (.7 + v * 1.1) * Math.sin(Math.min(1, (1 - v) * 1.6) * PI / 2) * (.75 + .3 * hash(k + i * 5));
      if (r < .6 || (clipTop !== undefined && p[1] - r < clipTop)) continue;
      c.beginPath(); c.arc(p[0], p[1], r, 0, TAU); c.fill();
      if (v > .25 && r > 1.5) { c.beginPath(); c.arc(p[0] + r * .9, p[1] + r * .25, r * .62, 0, TAU); c.fill(); }
    }
  }
}

function drawNoren(c, t) {
  // indigo-teal shop curtain in four panels, the emblem split across the centre slit; hems lift in the wind
  const n = ST.noren, z = n.z, nP = 4, pw = (n.x1 - n.x0) / nP, gap = .022;
  // light leaks through the slits
  const leak = [P(n.x0, n.h1, z), P(n.x1, n.h1, z), P(n.x1, n.h0, z), P(n.x0, n.h0, z)];
  fillP(c, leak, must);
  // the bulb hangs on its cord just below the curtain hem: a stepped glow (mustard ring, cream core) and a navy cap
  { const b = P(...ST.bulb); line3(c, [ST.bulb[0], ST.bulb[1] + .03, ST.bulb[2]], [ST.bulb[0], 2.3, ST.bulb[2]], navy, 1.2);
    burst(c, b[0], b[1] + 1, 6, 11, 12, cream, 1.8, 1, .2); rings(c, b[0], b[1] + 1, [[5.5, must], [3.4, cream]]);
    c.fillStyle = navy; c.fillRect(b[0] - 1.6, b[1] - 3.6, 3.2, 2); }
  const panels = [];
  for (let i = 0; i < nP; i++) {

    const sw = .022 + .02 * Math.sin(t * 1.15 + i * 1.3) + .01 * Math.sin(t * 2.9 + i * 2.1), lift = .012 * (1 + Math.sin(t * 1.6 + i));
    const pts = [[a, n.h1, z], [b, n.h1, z], [b + sw, n.h0 + lift, z - .015], [a + sw, n.h0 + lift, z - .015]];
    panels.push({ a, b, sw, lift, pts });
    fill3(c, pts, teal);
    // fold shadow and hem stitching
    poly3(c, [[lerp(a, b, .62), n.h1 - .04, z], [lerp(a, b, .62) + sw * .9, n.h0 + lift + .03, z]], navy, 1);
    poly3(c, [[a + sw + .02, n.h0 + lift + .035, z - .015], [b + sw - .02, n.h0 + lift + .035, z - .015]], cream, .7);

  for (const i of [1, 2]) {

    const sw = p.sw * .45, cx = ec[0] + sw, ctr = P(cx, ec[1], z), r = .1 * S(z);

    c.fillStyle = navy; c.beginPath(); c.moveTo(ctr[0] - r * .62, ctr[1] - r * .02); c.lineTo(ctr[0] + r * .62, ctr[1] - r * .02); c.quadraticCurveTo(ctr[0] + r * .55, ctr[1] + r * .55, ctr[0], ctr[1] + r * .58); c.quadraticCurveTo(ctr[0] - r * .55, ctr[1] + r * .55, ctr[0] - r * .62, ctr[1] - r * .02); c.fill();
    c.strokeStyle = navy; c.lineWidth = 1.3; c.beginPath(); c.moveTo(ctr[0] - r * .1, ctr[1] - r * .12); c.lineTo(ctr[0] + r * .55, ctr[1] - r * .72); c.moveTo(ctr[0] + r * .05, ctr[1] - r * .1); c.lineTo(ctr[0] + r * .68, ctr[1] - r * .58); c.stroke();
    c.strokeStyle = navy; c.lineWidth = 1; c.beginPath(); c.moveTo(ctr[0] - r * .45, ctr[1] - r * .2); c.quadraticCurveTo(ctr[0] - r * .6, ctr[1] - r * .45, ctr[0] - r * .4, ctr[1] - r * .7); c.stroke();

// the wind blows left to right (it drives the rain and the steam): the lantern hangs a little downwind and swings about that
function lanternState(t) { return -.07 + .04 * Math.sin(t * .9) + .016 * Math.sin(t * 2.3 + 1.1); }
function drawLanternGlow(c, t) {

  { const top = m(.13), bot = m(.51), cy = (top + bot) / 2, rx = m(.155), cx = pv[0] - Math.sin(ang) * cy, cyy = pv[1] + Math.cos(ang) * cy;
    c.save(); c.translate(cx, cyy);
    burst(c, 0, 0, rx * 1.55, rx * 2.45, 18, must, 3.2, 1.1, .17); rings(c, 0, 0, [[rx * 1.38, verm]], 1, 1.12);   // flat starburst glow

function drawLantern(c, t) {
  // bracket from the roof corner to the hook
  // a short timber arm off the roof corner, braced from the front post, with an iron hook
  fill3(c, [[ST.roof.x1 - .04, ST.roof.hf - .06, LANT.z], [LANT.px + .06, LANT.ph - .01, LANT.z], [LANT.px + .06, LANT.ph + .03, LANT.z], [ST.roof.x1 - .04, ST.roof.hf - .02, LANT.z]], verm);
  poly3(c, [[ST.roof.x1 - .04, ST.roof.hf - .02, LANT.z], [LANT.px + .06, LANT.ph + .03, LANT.z]], must, 1);
  { const hk = P(LANT.px, LANT.ph + .005, LANT.z); c.strokeStyle = cream; c.lineWidth = 1; c.beginPath(); c.arc(hk[0], hk[1], 1.8, 0, TAU); c.stroke(); }
  const pv = P(LANT.px, LANT.ph, LANT.z), s = S(LANT.z), ang = lanternState(t);
  const m = v => v * s;              // metres to px at the lantern's depth
  c.save(); c.translate(pv[0], pv[1]); c.rotate(ang);
  // cord, top cap
  c.strokeStyle = navy; c.lineWidth = 1.2; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, m(.1)); c.stroke();
  c.fillStyle = navy; c.fillRect(-m(.075), m(.1), m(.15), m(.035));
  // paper body
  const top = m(.13), bot = m(.51), cy = (top + bot) / 2, rx = m(.155), ry = (bot - top) / 2;
  c.fillStyle = verm; c.beginPath(); c.ellipse(0, cy, rx, ry * 1.06, 0, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.ellipse(0, cy, rx, ry * 1.06, 0, 0, TAU); c.clip();
  // lit core, stepped
  c.fillStyle = must; c.beginPath(); c.ellipse(-rx * .08, cy + ry * .05, rx * .55, ry * .8, 0, 0, TAU); c.fill();
  c.fillStyle = cream; c.beginPath(); c.ellipse(-rx * .12, cy + ry * .1, rx * .2, ry * .38, 0, 0, TAU); c.fill();
  // bamboo ribs: horizontal circles above the eye, so their near arcs bow upward; minor axis from the projection
  c.strokeStyle = navy; c.lineWidth = .8;
  for (let k = 1; k < 9; k++) { const y = top + (bot - top) * k / 9, w = rx * Math.sqrt(1 - Math.pow((y - cy) / (ry * 1.06), 2)), hRib = LANT.ph - y / s, ryR = Math.max(.3, w * (hRib - EYE) / LANT.z); c.beginPath(); c.ellipse(0, y, w, ryR, 0, PI, TAU); c.stroke(); }
  // shadowed right flank (away from the street side)
  c.fillStyle = navy; c.globalAlpha = 1; c.beginPath(); c.ellipse(rx * .98, cy, rx * .28, ry * 1.1, 0, 0, TAU); c.fill();
  c.restore();
  // bottom cap and tassel
  c.fillStyle = navy; c.fillRect(-m(.075), bot - 1, m(.15), m(.035));
  c.strokeStyle = navy; c.lineWidth = 1; c.beginPath(); for (let k = -2; k <= 2; k++) { c.moveTo(k * 1.2, bot + m(.035)); c.lineTo(k * 1.4, bot + m(.12)); } c.stroke();
  c.restore();
}

function drawBoard(c) {

  fillP(c, [map(.06, .86), map(.94, .86), map(.94, .9), map(.06, .9)], verm);
}

// ---- the customer, umbrella up, just arrived at the counter (back three-quarter view) ----
const PZ = 5.02;
function umbrellaGeom() {
  // Just stepping in: the umbrella rests back over the left shoulder, still sheltering the back of the head, tipped out so
  // its far edge passes clear below and left of the canopy (searched numerically: no contact, ~0.2 m gap, dome 0.47 m over the head)
  const A = [2.24, 2.15, 4.6], hand = [2.47, 1.36, 5.08];
  let u = [A[0] - hand[0], A[1] - hand[1], A[2] - hand[2]]; const ul = Math.hypot(...u); u = u.map(v => v / ul);

  const lantAng = lanternState(t), lpv = P(LANT.px, LANT.ph, LANT.z), lcy = .32 * S(LANT.z);
  PROF.s('drawStreaks'); drawStreaks(c, t, { dx: -Math.sin(lantAng) * lcy }); PROF.e('drawStreaks');
  PROF.s('drawBeacon'); drawBeacon(c, t); PROF.e('drawBeacon');
  PROF.s('drawSign'); drawSign(c, t); PROF.e('drawSign');
  PROF.s('drawRain'); drawRain(c, t, RAIN.far, false); PROF.e('drawRain');
  PROF.s('drawLampPost'); sprite(c, 'lamp', [560, 180, 920, 560], g => { drawLampCone(g); drawLampPost(g, t, false); }); PROF.e('drawLampPost');
  // the stall, back to front
  PROF.s('drawStallBack'); drawStallBack(c, t); PROF.e('drawStallBack');
  PROF.s('drawCrates'); drawCrates(c); PROF.e('drawCrates');
  PROF.s('drawCook'); const cook = drawCook(c, t); PROF.e('drawCook');
  PROF.s('drawPots'); drawPots(c, t, cook); PROF.e('drawPots');
  PROF.s('drawSteamInside'); drawSteamInside(c, t); PROF.e('drawSteamInside');
  PROF.s('drawCart'); drawCart(c); PROF.e('drawCart');
  PROF.s('drawCounter'); drawCounter(c, t); PROF.e('drawCounter');
  drawLanternGlow(c, t);
  PROF.s('drawPostsAndRoof'); drawPostsAndRoof(c, t); PROF.e('drawPostsAndRoof');
  poly3(c, [[5.16, 1.95, 5.52], [5.5, ST.roof.hf - .05, LANT.z]], verm, 2.2);   // lantern-arm brace from the front post, behind the valance
  PROF.s('drawNoren'); drawNoren(c, t); PROF.e('drawNoren');
  PROF.s('drawValance'); drawValance(c); PROF.e('drawValance');
  PROF.s('drawLantern'); drawLantern(c, t); PROF.e('drawLantern');
  PROF.s('drawStools'); drawStools(c); PROF.e('drawStools');
  PROF.s('drawBoard'); drawBoard(c); PROF.e('drawBoard');
  PROF.s('drawPerson'); const U = drawPerson(c, t); PROF.e('drawPerson');
  PROF.s('drawPuddleRipples'); drawPuddleRipples(c, t); PROF.e('drawPuddleRipples');
  PROF.s('drawGutters'); drawGutters(c, t); PROF.e('drawGutters');
  PROF.s('drawSplashes'); drawSplashes(c, t); PROF.e('drawSplashes');
  drawVent(c, t);
  PROF.s('drawDrips'); drawDrips(c, t, U); PROF.e('drawDrips');
  PROF.s('drawRain'); drawRain(c, t, RAIN.near, true); PROF.e('drawRain');
  c.restore();
  PROF.s('frame'); drawFrame(c); PROF.e('frame');
}

const PROF = { on: Q.has('prof'), acc: {}, t0: 0, s(n) { if (this.on) this.t0 = performance.now(); }, e(n) { if (this.on) this.acc[n] = (this.acc[n] || 0) + performance.now() - this.t0; } };
// ---- sprite cache: static pieces drawn once per canvas size (halftone glows are many dots) ----
const SPR = new Map();
function sprite(c, key, bb, fn) {
  let sp = SPR.get(key);
  if (!sp) {
    const [x0, y0, x1, y1] = bb, cnv = document.createElement('canvas');
    cnv.width = Math.ceil((x1 - x0) * KSCALE); cnv.height = Math.ceil((y1 - y0) * KSCALE);
    const g = cnv.getContext('2d'); g.setTransform(KSCALE, 0, 0, KSCALE, -x0 * KSCALE, -y0 * KSCALE); fn(g);
    sp = { cnv, bb }; SPR.set(key, sp);
  }
  c.drawImage(sp.cnv, sp.bb[0], sp.bb[1], sp.bb[2] - sp.bb[0], sp.bb[3] - sp.bb[1]);
}
// ---- mount ----
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let KSCALE = 1, L0 = null;
function size() {
  const dpr = Math.min(DPRMAX, window.devicePixelRatio || 1), w = Math.round((cv.getBoundingClientRect().width || W) * dpr);
  cv.width = w; cv.height = Math.round(w * H / W); KSCALE = w / W;
  SPR.clear();
  L0 = document.createElement('canvas'); L0.width = cv.width; L0.height = cv.height;
  const c = L0.getContext('2d'); c.setTransform(KSCALE, 0, 0, KSCALE, 0, 0); drawStatic(c);
}
buildStreaks(); buildRain(); buildZones();
size(); window.addEventListener('resize', size);
function render(t) {
  const t0 = performance.now();
  PROF.s('blit'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(L0, 0, 0); PROF.e('blit');
  ctx.setTransform(KSCALE, 0, 0, KSCALE, 0, 0); drawScene(ctx, t);
  cv.dataset.ms = Math.round(performance.now() - t0); cv.dataset.frames = (+cv.dataset.frames || 0) + 1;
  if (PROF.on) cv.dataset.prof = JSON.stringify(Object.fromEntries(Object.entries(PROF.acc).map(([k, v]) => [k, +v.toFixed(1)])));
}
if (TFIX !== null) { render(TFIX); PROF.acc = {}; render(TFIX); }   // second pass measures steady-state cost
else {
  let last = -1;
  const loop = now => { const t = now / 1000; if (t - last > 1 / 30) { last = t; render(t + 20); } requestAnimationFrame(loop); };
  render(20); requestAnimationFrame(loop);
}
})();
</script>
